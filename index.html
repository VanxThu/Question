  <script>
    (function initFloatingHearts() {
      const canvas = document.getElementById('hearts-canvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      // Heart particle class
      class Heart {
        constructor() {
          this.reset(true);
        }

        reset(initial = false) {
          this.x = Math.random() * width;
          this.y = initial ? Math.random() * height : height + 30;
          this.size = Math.random() * 18 + 10;
          this.speedY = Math.random() * 1.2 + 0.6;
          this.speedX = (Math.random() - 0.5) * 0.7;
          this.opacity = Math.random() * 0.55 + 0.25;
          this.oscillationSpeed = Math.random() * 0.03 + 0.01;
          this.oscillationDistance = Math.random() * 25 + 10;
          this.angle = Math.random() * Math.PI * 2;
          this.rotation = (Math.random() - 0.5) * 0.4;

          const colors = [
            '255, 105, 180', // HotPink
            '255, 182, 193', // LightPink
            '254, 163, 197', // Sweet Pink
            '244, 63, 127',  // Deep Rose
            '251, 111, 159', // Pastel Magenta
            '238, 130, 238', // Violet Pink
          ];
          this.color = colors[Math.floor(Math.random() * colors.length)];
        }

        update() {
          this.y -= this.speedY;
          this.angle += this.oscillationSpeed;
          this.currentX = this.x + Math.sin(this.angle) * this.oscillationDistance;

          if (this.y < -40) {
            this.reset(false);
          }
        }

        draw() {
          ctx.save();
          ctx.translate(this.currentX, this.y);
          ctx.rotate(this.rotation);
          ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;

          ctx.beginPath();
          const d = this.size;
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-d / 2, -d / 2, -d, d / 3, 0, d);
          ctx.bezierCurveTo(d, d / 3, d / 2, -d / 2, 0, 0);
          ctx.fill();

          ctx.restore();
        }
      }

      const count = Math.min(Math.floor((width * height) / 18000), 45);
      const hearts = Array.from({ length: count }, () => new Heart());

      function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < hearts.length; i++) {
          hearts[i].update();
          hearts[i].draw();
        }
        requestAnimationFrame(animate);
      }

      animate();

      // Click / Tap effect: spawn miniature hearts
      window.addEventListener('click', (e) => {
        for (let i = 0; i < 4; i++) {
          const h = new Heart();
          h.x = e.clientX;
          h.y = e.clientY;
          h.speedY = Math.random() * 2 + 1;
          h.size = Math.random() * 14 + 8;
          hearts.push(h);
          if (hearts.length > count + 15) hearts.shift();
        }
      });
    })();
  </script>

                    let buttonClass = "bg-white/80 text-gray-600 border border-pink-200 hover:bg-pink-100/70";
                    if (isCurrent) {
                      buttonClass = "bg-sweetpink-500 text-white font-extrabold ring-4 ring-pink-300/70 scale-105 shadow-md shadow-pink-300 z-10";
                    } else if (isAnswered) {
                      buttonClass = "bg-pink-100 text-sweetpink-700 border-2 border-pink-400 font-bold hover:bg-pink-200";
                    }

                    return (
                      <button
                        key={q.id}
                        onClick={() => handleJumpToQuestion(idx)}
                        className={`h-10 rounded-xl flex items-center justify-center text-sm transition-all duration-150 active:scale-95 relative ${buttonClass}`}
                        title={`Câu ${q.id}: ${isAnswered ? 'Đã làm' : 'Chưa làm'}`}
                      >
                        {q.id}
                        {isAnswered && !isCurrent && (
                          <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-sweetpink-500 rounded-full border border-white"></span>
                        )}
                      </button>
                    );
                  })}
                </div>
              </div>
            </main>
          ) : (
            /* ================= MÀN HÌNH KẾT QUẢ (SAU KHI NỘP) ================= */
            <main className="w-full">
              {(() => {
                const score = calculateScore();
                const feedback = getFeedback(score);

                return (
                  <div className="space-y-6">
                    {/* Bảng Điểm Tổng Quan */}
                    <div className="glass-card rounded-3xl p-6 sm:p-8 text-center relative overflow-hidden">
                      <div className="text-4xl mb-2 animate-bounce-slow">{feedback.icon}</div>
                      
                      <span className={`inline-block px-4 py-1 rounded-full text-xs sm:text-sm font-bold border mb-3 ${feedback.badgeBg}`}>
                        {feedback.title}
                      </span>

                      <div className="my-2">
                        <span className="text-gray-500 font-semibold text-lg">Điểm số của bạn:</span>
                        <div className="text-5xl sm:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-sweetpink-600 via-rose-500 to-pink-500 my-1">
                          {score} <span className="text-2xl sm:text-3xl text-gray-400 font-bold">/ {totalQuestions}</span>
                        </div>
                        <span className="text-sm font-semibold text-sweetpink-600">
                          (Đạt {Math.round((score / totalQuestions) * 100)}% độ chính xác)
                        </span>
                      </div>

                      <p className="text-gray-700 text-sm sm:text-base max-w-lg mx-auto mt-3 bg-pink-50/70 p-4 rounded-2xl border border-pink-100">
                        {feedback.message}
                      </p>

                      <div className="mt-6">
                        <button
                          onClick={handleRestart}
                          className="px-6 py-2.5 rounded-2xl font-bold text-sm bg-gradient-to-r from-sweetpink-500 to-rose-500 hover:from-sweetpink-600 hover:to-rose-600 text-white shadow-md shadow-pink-300 hover:shadow-lg transition-all active:scale-95 inline-flex items-center gap-2"
                        >
                          <span>🔄</span> Làm lại thử thách
                        </button>
                      </div>
                    </div>

                    {/* Chi Tiết Từng Câu Hỏi */}
                    <div className="glass-card rounded-3xl p-6 sm:p-8">
                      <div className="flex items-center justify-between border-b border-pink-100 pb-4 mb-6">
                        <h2 className="text-lg sm:text-xl font-bold text-gray-800 flex items-center gap-2">
                          <span>📋</span> Chi tiết đáp án từng câu hỏi
                        </h2>
                        <span className="text-xs font-semibold text-gray-500 bg-pink-100 px-3 py-1 rounded-full">
                          {score}/{totalQuestions} câu đúng
                        </span>
                      </div>

                      <div className="space-y-5">
                        {QUIZ_DATA.map((q) => {
                          const userChoiceKey = userAnswers[q.id];
                          const isCorrect = userChoiceKey === q.correctAnswer;
                          const isUnanswered = userChoiceKey === undefined;

                          const userChoiceObj = q.options.find(o => o.key === userChoiceKey);
                          const correctChoiceObj = q.options.find(o => o.key === q.correctAnswer);

                          return (
                            <div
                              key={q.id}
                              className={`p-4 sm:p-5 rounded-2xl border transition-all ${
                                isCorrect
                                  ? "bg-emerald-50/70 border-emerald-200"
                                  : "bg-rose-50/70 border-rose-200"
                              }`}
                            >
                              <div className="flex items-start justify-between gap-3 mb-3">
                                <h3 className="font-bold text-gray-800 text-base">
                                  <span className="text-sweetpink-600 mr-1.5">Câu {q.id}:</span>
                                  {q.question}
                                </h3>

                                <span
                                  className={`flex-shrink-0 text-xs px-2.5 py-1 rounded-full font-bold flex items-center gap-1 ${
                                    isCorrect
                                      ? "bg-emerald-100 text-emerald-800 border border-emerald-300"
                                      : "bg-rose-100 text-rose-800 border border-rose-300"
                                  }`}
                                >
                                  {isCorrect ? "✅ Chính xác" : (isUnanswered ? "⚠️ Bỏ trống" : "❌ Chưa đúng")}
                                </span>
                              </div>

                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm mt-3 pt-3 border-t border-gray-200/60">
                                <div className={`p-2.5 rounded-xl flex items-center gap-2 ${
                                  isCorrect
                                    ? "bg-emerald-100/60 text-emerald-900 border border-emerald-200"
                                    : "bg-rose-100/60 text-rose-900 border border-rose-200"
                                }`}>
                                  <span className="font-bold text-xs uppercase px-2 py-0.5 rounded bg-white/70">
                                    Bạn chọn:
                                  </span>
                                  <span className="font-semibold">
                                    {isUnanswered ? (
                                      <i className="text-gray-400 font-normal">Chưa chọn đáp án</i>
                                    ) : (
                                      `${userChoiceObj?.key}. ${userChoiceObj?.text}`
                                    )}
                                  </span>
                                </div>

                                <div className="p-2.5 rounded-xl bg-white/80 text-emerald-900 border border-emerald-300 flex items-center gap-2 shadow-sm">
                                  <span className="font-bold text-xs uppercase px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">
                                    Đáp án đúng:
                                  </span>
                                  <span className="font-bold text-emerald-700">
                                    {correctChoiceObj?.key}. {correctChoiceObj?.text}
                                  </span>
                                </div>
                              </div>

                              <div className="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-1.5 text-xs">
                                {q.options.map((opt) => {
                                  const isUserSelectedThis = opt.key === userChoiceKey;
                                  const isThisCorrect = opt.key === q.correctAnswer;

                                  let optBadge = "bg-white/60 text-gray-500 border border-gray-100";
                                  if (isThisCorrect) {
                                    optBadge = "bg-emerald-200/80 text-emerald-900 font-bold border border-emerald-400";
                                  } else if (isUserSelectedThis && !isCorrect) {
                                    optBadge = "bg-rose-200/80 text-rose-900 font-bold border border-rose-400 line-through opacity-80";
                                  }

                                  return (
                                    <div key={opt.key} className={`px-2 py-1.5 rounded-lg text-center truncate ${optBadge}`} title={`${opt.key}. ${opt.text}`}>
                                      {opt.key}. {opt.text}
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      <div className="mt-8 text-center">
                        <button
                          onClick={handleRestart}
                          className="px-8 py-3 rounded-2xl font-bold text-base bg-gradient-to-r from-sweetpink-500 to-rose-500 hover:from-sweetpink-600 hover:to-rose-600 text-white shadow-lg shadow-pink-300 transition-all active:scale-95"
                        >
                          🔄 Chơi lại từ đầu
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })()}
            </main>
          )}

          {/* Modal Cảnh Báo Nếu Nộp Bài Khi Chưa Làm Hết */}
          {showConfirmModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
              <div className="glass-card rounded-3xl p-6 sm:p-7 max-w-sm w-full text-center border-2 border-pink-200 shadow-2xl">
                <div className="text-4xl mb-2">💌❓</div>
                <h3 className="text-xl font-bold text-gray-800 mb-2">Em có chắc muốn nộp?</h3>
                <p className="text-sm text-gray-600 mb-6">
                  Bạn vẫn còn <span className="font-bold text-sweetpink-600">{totalQuestions - answeredCount}</span> câu chưa trả lời. Nộp ngay hệ thống sẽ chấm các câu chưa làm là 0 điểm đó nha!
                </p>
                <div className="flex gap-3">
                  <button
                    onClick={() => setShowConfirmModal(false)}
                    className="flex-1 py-2.5 rounded-xl font-semibold text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 transition-colors"
                  >
                    Làm tiếp
                  </button>
                  <button
                    onClick={executeSubmit}
                    className="flex-1 py-2.5 rounded-xl font-bold text-sm bg-gradient-to-r from-sweetpink-500 to-rose-500 text-white shadow-md shadow-pink-300 transition-all"
                  >
                    Vẫn nộp luôn
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer Dễ Thương */}
          <footer className="text-center mt-8 py-4 text-xs text-sweetpink-600 font-medium">
          anv
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
